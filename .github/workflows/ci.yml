name: CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No id-token, so a pull request never gets AWS credentials. This matters: the landing zone's role
# trusts every branch of every repository under the account, and this is a public repository, so a
# fork's pull request runs here too.
permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 24 for the country generator's built-in TypeScript support; see the README.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Runs tsc before vite, so a type error fails here.
      - name: Build
        run: npm run build
