name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SPA_DOMAIN: flags.osbornesupremacy.com
  SITE_URL: https://flags.osbornesupremacy.com

jobs:
  deploy:
    name: Build and deploy the site
    runs-on: ubuntu-latest

    # The landing zone's role trusts every branch of every repository under the account, so nothing
    # at the AWS end stops a manual run from another branch publishing it. This does.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      # The landing zone's github-actions role, as in ses-ui.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Found by alias rather than configured, as in ses-ui: the alias is what makes this
      # distribution the right one, so the answer cannot go stale. Empty is a hard failure rather
      # than an invalidation quietly aimed at nothing.
      - name: Resolve CloudFront distribution
        run: |
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '${SPA_DOMAIN}')].Id | [0]" \
            --output text)

          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "No CloudFront distribution serves ${SPA_DOMAIN}." >&2
            exit 1
          fi

          echo "DISTRIBUTION_ID=$id" >> "$GITHUB_ENV"
          echo "Distribution: $id"

      # Composed from the caller's account id the way locals.tf composes it, as ses-ui's database
      # workflow composes its inbox bucket. This keeps the account id out of the repository.
      - name: Resolve bucket
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=bro-flags-of-the-world-${account_id}-${AWS_REGION}-an" >> "$GITHUB_ENV"

      # The same script as a local deploy, given its targets through the environment instead of
      # Terraform outputs, and publishing the build above rather than building again.
      - name: Deploy
        env:
          SKIP_BUILD: '1'
        run: ./scripts/deploy.sh
